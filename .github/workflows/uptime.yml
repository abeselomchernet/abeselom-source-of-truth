name: Public site uptime check

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public HTTPS site
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 20 \
            --header 'User-Agent: abeselom-source-of-truth-uptime/1.0' \
            https://abeselomchernet.github.io/abeselom-source-of-truth/ \
            > /dev/null
